<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui,-apple-system,Segoe UI,sans-serif;width:320px;margin:0;color:#1b1b1b}
header{background:#162e51;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
header img{width:28px;height:28px}main{padding:12px}
button{width:100%;padding:11px;border:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin:6px 0}
#pull{background:#b50909;color:#fff}#dl{background:#162e51;color:#fff}button:disabled{opacity:.5}
.m{font-size:13px;color:#444}.ok{color:#196b24;font-weight:600}.err{color:#b50909;font-weight:600}
</style></head><body><header><img src="icons/icon48.png" alt="">VA to Z Sync</header><main>
<p class="m">1. Log in at <b>VA.gov</b> in this browser.<br>2. Press the button below.<br>3. Review and apply it in the VA to Z app (Tools → Sync VA Data).</p>
<button id="pull">Pull my VA data</button>
<div id="msg" class="m"></div>
<button id="dl" style="display:none">Download VA data file</button>
<p class="m" style="font-size:12px">Read-only. This extension never sees or stores your password. Data stays on this computer.</p>
</main><script src="popup.js"></script></body></html>
